<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ListFlow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c57e6"/>
      <stop offset="1" stop-color="#5a3cc4"/>
    </linearGradient>
  </defs>

  <!-- Full bleed: the home screen applies its own rounding and would clip a
       corner radius of ours into a visible seam. -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- A list, with the last row running off to the right: the rows are the
       listing, the arrow is it leaving for Etsy. Kept inside the middle 70%
       so a round or squircle mask cannot cut into it. -->
  <g fill="#ffffff">
    <rect x="130" y="150" width="252" height="42" rx="21"/>
    <rect x="130" y="235" width="252" height="42" rx="21"/>
    <rect x="130" y="320" width="132" height="42" rx="21"/>
    <path d="M300 341 L352 341 M330 315 L360 341 L330 367" fill="none" stroke="#ffffff"
          stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
